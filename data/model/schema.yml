# Model schema
#
# Grain, keys, and who each column is for. An empty cell in a CSV is null.
# Governed columns are the ones a metric is allowed to use. Raw columns keep
# the source value so a treatment can be audited.
#
# Marts are built by python pipeline/build.py from these tables. SQL marts are
# defined in data/marts/sql/*.sql. The mart_user_share_* tables have no SQL
# file and are generated from USER_SHARE_CUTS in pipeline/user_share.py.
# Marts exclude test accounts. Fact tables keep those rows and flag them
# with is_test_account.
# user_name and email are restricted. They are not in any mart.
# age_band is not restricted.
#
# Sections: tables (the model), views (unpublished intermediate models), and
# marts (published as CSV in data/marts/ and as JSON in site/data/marts/).

tables:
  - name: dim_business
    grain: one row per business_id
    primary_key: business_id
    rows: 3
    columns:
      - {name: business_id, description: Business key.}
      - {name: business_name, description: Display name, including the synthetic label from the source.}
      - {name: business_line, description: premium_published_content, consumer_community, or creator_content.}
      - {name: launch_date, description: Date the business launched.}
      - {name: hq_planet, description: Headquarters in the synthetic world. Kept as given.}

  - name: dim_user
    grain: one row per user_id
    primary_key: user_id
    rows: 800
    notes: Six identical duplicate user rows were dropped from the raw file of 806 rows.
    columns:
      - {name: user_id, description: User key.}
      - {name: user_name, description: Display name., access: restricted}
      - {name: email, description: Email address., access: restricted}
      - {name: signup_date, description: Date the account was created.}
      - {name: country, description: Country as given, including fictional countries that belong to this world.}
      - {name: age_band, description: Governed age band. Blank, N/A, and 999 are unknown.}
      - {name: age_band_raw, description: Source age band, kept so the reason for unknown is visible.}
      - {name: acquisition_channel, description: Governed channel. Blank, carrier_pigeon, and influencer_TEST_CAMPAIGN are unknown.}
      - {name: acquisition_channel_raw, description: Source channel.}
      - {name: primary_device, description: Governed device. smart_toaster and unknown_device are unknown.}
      - {name: primary_device_raw, description: Source device.}
      - {name: is_test_account, description: true or false. Marts exclude true.}

  - name: dim_creator
    grain: one row per creator_id
    primary_key: creator_id
    foreign_keys:
      - {column: business_id, references: dim_business.business_id}
    rows: 40
    notes: 37 creators are MakerHarbor. Three are PageGarden and have no content pointing at them. GatherSquare has none.
    columns:
      - {name: creator_id, description: Creator key.}
      - {name: creator_name, description: Display name.}
      - {name: business_id, description: Business the creator belongs to.}
      - {name: join_date, description: Date the creator joined.}
      - {name: payout_tier, description: Tier_0_Starter through Tier_3_Partner.}
      - {name: follower_count, description: Governed follower count. Null when the source is negative or 999999.}
      - {name: follower_count_raw, description: Source follower count.}
      - {name: follower_count_is_invalid, description: true when follower_count was nulled.}

  - name: dim_content
    grain: one row per content_id
    primary_key: content_id
    foreign_keys:
      - {column: business_id, references: dim_business.business_id}
      - {column: creator_id, references: dim_creator.creator_id, nullable: true}
    rows: 300
    notes: creator_id is null for every PageGarden and GatherSquare item. It is populated for every MakerHarbor item.
    columns:
      - {name: content_id, description: Content key.}
      - {name: business_id, description: Business that published the item.}
      - {name: creator_id, description: Creator key, or null when the source was blank.}
      - {name: title, description: Title.}
      - {name: category, description: Category as given.}
      - {name: content_type, description: Governed type. TEST_TYPE is unknown.}
      - {name: content_type_raw, description: Source content type.}
      - {name: publish_date, description: Date the item was published.}
      - {name: runtime_minutes, description: Governed runtime. Null when the source is negative or 99999.}
      - {name: runtime_minutes_raw, description: Source runtime.}
      - {name: runtime_minutes_is_invalid, description: true when runtime_minutes was nulled.}

  - name: fct_subscription
    grain: one row per subscription_id
    primary_key: subscription_id
    foreign_keys:
      - {column: user_id, references: dim_user.user_id}
      - {column: business_id, references: dim_business.business_id}
    rows: 843
    notes: A user can hold more than one subscription, including across businesses. Status and price for metrics come from this table, not from engagement events.
    columns:
      - {name: subscription_id, description: Subscription key.}
      - {name: user_id, description: Subscriber.}
      - {name: business_id, description: Business being subscribed to.}
      - {name: plan_tier, description: Free, Basic, Premium, or Premium_Plus_Deluxe_XL.}
      - {name: billing_cycle, description: monthly, annual, lifetime_deal_fake, or not_applicable for Free.}
      - {name: billing_cycle_raw, description: Source billing cycle. Blank on Free plans.}
      - {name: monthly_price_usd, description: Governed monthly price. Null when the source is negative or 999.99. Zero on Free.}
      - {name: monthly_price_usd_raw, description: Source price.}
      - {name: monthly_price_is_invalid, description: true when monthly_price_usd was nulled.}
      - {name: start_date, description: Subscription start date.}
      - {name: end_date, description: End date, or null. Null is valid unless status_raw is canceled.}
      - {name: status, description: Governed status. TEST_STATUS_DO_NOT_USE is unknown.}
      - {name: status_raw, description: Source status.}
      - {name: is_test_account, description: true when the subscriber is a test account.}

  - name: fct_engagement_event
    grain: one row per event_id
    primary_key: event_id
    foreign_keys:
      - {column: user_id, references: dim_user.user_id}
      - {column: content_id, references: dim_content.content_id, nullable: true}
    rows: 6000
    notes: content_id is null for every search, page view, and subscription event, plus two glitch events. This fact is not given a business_id. Business for content events comes from dim_content.
    columns:
      - {name: event_id, description: Event key.}
      - {name: user_id, description: User who triggered the event.}
      - {name: content_id, description: Content key, or null when the event is not about one title.}
      - {name: event_type, description: Governed event type. glitch_in_the_matrix is unknown.}
      - {name: event_type_raw, description: Source event type.}
      - {name: event_timestamp, description: Timestamp of the event.}
      - {name: device, description: Governed device. smart_toaster and unknown_device are unknown.}
      - {name: device_raw, description: Source device.}
      - {name: session_duration_sec, description: Governed duration in seconds. Null for -15, 86400, and 604800.}
      - {name: session_duration_sec_raw, description: Source duration.}
      - {name: session_duration_is_invalid, description: true when session_duration_sec was nulled.}
      - {name: is_test_account, description: true when the user is a test account.}

# Intermediate models. Built as views, not published. int_user_info and
# eph_user_info carry user_id, so they stay out of site/.
views:
  - name: int_dates
    grain: one row per calendar date
    primary_key: date
    defined_in: data/marts/sql/int_dates.sql
    notes: Date spine from 2021-01-01 to 2026-10-12. The range is hardcoded because the source data is not live.
    columns:
      - {name: date, description: Calendar date.}

  - name: int_daily_users
    grain: one row per date with at least one subscription start or cancellation
    primary_key: date
    defined_in: data/marts/sql/int_daily_users.sql
    notes: Non-test subscriptions only. Days with no activity are dropped. A cancellation is dated by end_date and counts only when status is canceled.
    columns:
      - {name: date, description: Calendar date.}
      - {name: user_subscriptions, description: Distinct non-test subscriptions with this start_date.}
      - {name: user_cancellations, description: Distinct canceled non-test subscriptions with this end_date.}

  - name: int_user_info
    grain: one row per user_id with at least one active non-test subscription
    primary_key: user_id
    defined_in: data/marts/sql/int_user_info.sql
    notes: Joins subscription counts to the governed country, age band, acquisition channel, and device on dim_user. Person-level, so it is not published.
    columns:
      - {name: user_id, description: User key. Used for distinct counts. Not shown.}
      - {name: n_subs_active, description: Active non-test subscriptions held by the user.}
      - {name: n_subs_paid, description: Active subscriptions on a plan other than Free.}
      - {name: n_subs_free, description: Active subscriptions on the Free plan.}
      - {name: n_subs_basic, description: Active subscriptions on the Basic plan.}
      - {name: n_biz_supported, description: Distinct businesses the user actively subscribes to.}
      - {name: monthly_payment, description: Sum of governed monthly price on the user's active subscriptions. Invalid prices are omitted.}
      - {name: user_geo_country, description: Governed country from dim_user.}
      - {name: user_age_band, description: Governed age band from dim_user.}
      - {name: user_acq_channel, description: Governed acquisition channel from dim_user.}
      - {name: user_prim_device, description: Governed primary device from dim_user.}

  - name: eph_user_info
    grain: one row per user_id with at least one active non-test subscription
    primary_key: user_id
    defined_in: data/marts/sql/eph_user_info.sql
    notes: A pass-through of int_user_info. It is the source for every mart_user_share_* table. Not published.
    columns:
      - {name: user_id, description: Same columns as int_user_info.}

  - name: int_content_event_counts
    grain: one row per content_id and event_type
    primary_key: [content_id, event_type]
    defined_in: data/marts/sql/int_content_event_counts.sql
    notes: Counts only content_complete, content_open, and download events, and excludes test accounts. A title with none of those events is dropped by the inner join. Today every title has at least one.
    columns:
      - {name: content_id, description: Content key.}
      - {name: title, description: Title.}
      - {name: category, description: Category as given.}
      - {name: content_type, description: Governed content type.}
      - {name: publish_date, description: Date the item was published.}
      - {name: duration_min, description: Governed runtime in minutes, from dim_content.runtime_minutes.}
      - {name: event_type, description: content_complete, content_open, or download.}
      - {name: n_events, description: Distinct non-test events of this type on this title.}

# Published marts. The dashboard reads only these.
marts:
  - name: mart_user_info_counts
    grain: one row, the whole active non-test user base
    rows: 1
    defined_in: data/marts/sql/mart_user_info_counts.sql
    notes: Feeds the dashboard score cards. Built from int_user_info. n_users_active is a distinct count of people. The subscription counts are sums over those people.
    columns:
      - {name: n_users_active, description: Distinct non-test users with an active subscription.}
      - {name: n_subs_active, description: Active non-test subscriptions.}
      - {name: n_subs_paid, description: Active subscriptions on a plan other than Free.}
      - {name: n_subs_free, description: Active subscriptions on the Free plan.}
      - {name: n_subs_basic, description: Active subscriptions on the Basic plan.}
      - {name: total_monthly_payment, description: Sum of governed monthly price on active non-test subscriptions. Invalid prices are omitted. This is a monthly price total, not annualized revenue.}
      - {name: avg_subs, description: n_subs_active divided by n_users_active.}
      - {name: avg_subs_paid, description: n_subs_paid divided by n_users_active.}
      - {name: avg_subs_free, description: n_subs_free divided by n_users_active.}
      - {name: avg_monthly_payment, description: total_monthly_payment divided by n_users_active.}

  - name: mart_user_qtr_counts
    grain: one row per calendar quarter with at least one subscription start or cancellation
    primary_key: quarter
    rows: 21
    defined_in: data/marts/sql/mart_user_qtr_counts.sql
    notes: Feeds the line chart. Built from int_daily_users. Both measures are additive across quarters. The last quarter, Q3 2026, is partial. Quarters with no activity are not present.
    columns:
      - {name: quarter, description: First day of the quarter.}
      - {name: user_subscriptions, description: Non-test subscriptions that started in the quarter.}
      - {name: user_cancellations, description: Canceled non-test subscriptions that ended in the quarter.}

  - name: mart_content_engagement
    grain: one row per content_id
    primary_key: content_id
    rows: 300
    defined_in: data/marts/sql/mart_content_engagement.sql
    notes: Feeds the Content Performance table. Built from int_content_event_counts, so test-account events are excluded. Sorted by n_engagement_events descending, then content_id, so the build is repeatable when counts tie. n_engagement_events counts only the three event types shown here.
    columns:
      - {name: content_id, description: Content key. Used by the dashboard as the row key, not shown.}
      - {name: title, description: Title.}
      - {name: category, description: Category as given.}
      - {name: content_type, description: Governed content type.}
      - {name: publish_date, description: Date the item was published.}
      - {name: duration_min, description: Governed runtime in minutes. Not shown on the dashboard.}
      - {name: n_content_complete, description: content_complete events.}
      - {name: n_content_open, description: content_open events.}
      - {name: n_download, description: download events.}
      - {name: n_engagement_events, description: Sum of the three counts above.}

  # The mart_user_share_* tables are generated, not written in SQL. Each one
  # groups eph_user_info by one column and counts distinct users. To add one,
  # add a line to USER_SHARE_CUTS in pipeline/user_share.py. The shared shape is:
  #   <value column>, n_users (distinct user_id), n_share (n_users / sum of n_users, 4 places)
  # n_users is a distinct count of people, so it is not additive across tables.
  # Each table's n_users adds up to the 389 active non-test users.
  - name: mart_user_share_country
    grain: one row per user_geo_country
    primary_key: user_geo_country
    rows: 18
    defined_in: pipeline/user_share.py
    columns:
      - {name: user_geo_country, description: Governed country.}
      - {name: n_users, description: Distinct active non-test users.}
      - {name: n_share, description: Share of the 389 active users.}

  - name: mart_user_share_age
    grain: one row per user_age_band
    primary_key: user_age_band
    rows: 8
    defined_in: pipeline/user_share.py
    notes: age_band is not restricted. Unknown is its own row.
    columns:
      - {name: user_age_band, description: Governed age band.}
      - {name: n_users, description: Distinct active non-test users.}
      - {name: n_share, description: Share of the 389 active users.}

  - name: mart_user_share_device
    grain: one row per user_prim_device
    primary_key: user_prim_device
    rows: 5
    defined_in: pipeline/user_share.py
    columns:
      - {name: user_prim_device, description: Governed primary device. Unknown is its own row.}
      - {name: n_users, description: Distinct active non-test users.}
      - {name: n_share, description: Share of the 389 active users.}

  - name: mart_user_share_channel
    grain: one row per user_acq_channel
    primary_key: user_acq_channel
    rows: 5
    defined_in: pipeline/user_share.py
    columns:
      - {name: user_acq_channel, description: Governed acquisition channel. Unknown is its own row.}
      - {name: n_users, description: Distinct active non-test users.}
      - {name: n_share, description: Share of the 389 active users.}

  - name: mart_user_share_subs_active
    grain: one row per n_subs_active
    primary_key: n_subs_active
    rows: 3
    defined_in: pipeline/user_share.py
    notes: Approved exception to the under-5 rule. Every group is shown, including a group of one.
    columns:
      - {name: n_subs_active, description: Number of active subscriptions a user holds.}
      - {name: n_users, description: Distinct active non-test users with that many.}
      - {name: n_share, description: Share of the 389 active users.}

  - name: mart_user_share_subs_paid
    grain: one row per n_subs_paid
    primary_key: n_subs_paid
    rows: 4
    defined_in: pipeline/user_share.py
    notes: Approved exception to the under-5 rule. Every group is shown, including a group of one.
    columns:
      - {name: n_subs_paid, description: Number of active paid subscriptions a user holds.}
      - {name: n_users, description: Distinct active non-test users with that many.}
      - {name: n_share, description: Share of the 389 active users.}
