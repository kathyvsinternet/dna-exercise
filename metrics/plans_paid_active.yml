name: plans_paid_active
question: How many active subscriptions are for a paid plan?
source: data/marts/mart_plans.csv
sum: subscriptions
filters:
  - column: status
    equals: active
  - column: plan_tier
    not_equals: Free
group_by:
  - business_id
  - plan_tier
  - billing_cycle
notes:
  - This is plans_active with Free removed. Both metrics sum mart_plans.
  - A Free plan stays in plans_active and stays out of this metric.
  - mart_plans already excludes test accounts.
known_result:
  note: Result of mart_plans. Recompute after python pipeline/build.py.
  total: 310
  by_business_id:
    BIZ_1: 94
    BIZ_2: 116
    BIZ_3: 100
  by_plan_tier:
    Basic: 115
    Premium: 85
    Premium_Plus_Deluxe_XL: 110
