name: plans_active
question: How many active plan subscriptions do we have??
source: data/marts/mart_plans.csv
sum: subscriptions
filters:
  - column: status
    equals: active
group_by:
  - business_id
  - plan_tier
  - billing_cycle
notes:
  - Sum the subscriptions column. mart_plans already excludes test accounts, and one row is one business, plan, cycle, and status.
  - A person with two active subscriptions counts twice. This metric counts plans, not people.
  - A status of unknown is not active.
  - subscription_start events are not plans.
known_result:
  note: Result of mart_plans. Recompute after python pipeline/build.py.
  total: 444
  by_business_id:
    BIZ_1: 137
    BIZ_2: 158
    BIZ_3: 149
