name: subscribers_active
question: How many users hold an active subscription?
source: data/marts/mart_subscription.csv
count_distinct: user_id
filters:
  - column: status
    equals: active
group_by:
  - business_id
notes:
  - Count people on mart_subscription, not rows of mart_plans. plans_active sums plans.
  - Recompute the distinct count at every grain. mart_active_subscribers has one row per business, and adding those rows double-counts a person who is active in more than one business.
  - mart_subscription already excludes test accounts. A status of unknown is not active.
known_result:
  note: Result of mart_subscription. Recompute after python pipeline/build.py.
  total: 389
  by_business_id:
    BIZ_1: 125
    BIZ_2: 147
    BIZ_3: 145
  business_totals_sum: 417
  people_active_in_more_than_one_business: 28
