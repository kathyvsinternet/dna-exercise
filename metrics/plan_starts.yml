name: plan_starts
question: How many subscriptions began within a certain date range?
source: data/marts/mart_plan_starts.csv
sum: plan_starts
parameters:
  - name: period_start
    column: start_date_month
    comparison: on_or_after
  - name: period_end
    column: start_date_month
    comparison: on_or_before
filters:
  - column: start_date_month
    on_or_after: period_start
  - column: start_date_month
    on_or_before: period_end
group_by:
  - business_id
  - plan_tier
  - start_date_month
notes:
  - Sum plan_starts. Each row is one business, plan tier, and start month, and the mart already excludes test accounts.
  - The period is whole months. A start in the month counts even when the subscription is later canceled, paused, or unknown.
  - The period is required. There is no default window.
  - subscription_start events are a different count.
known_result:
  note: One worked example from mart_plan_starts, for 2026-01 through 2026-09. The latest start_date in the fact table is 2026-09-19.
  period_start: "2026-01"
  period_end: "2026-09"
  total: 311
  by_business_id:
    BIZ_1: 99
    BIZ_2: 108
    BIZ_3: 104
