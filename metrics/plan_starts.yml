name: plan_starts
question: How many subscriptions began within a certain date range?
source: data/model/fct_subscription.csv
count: subscription_id
parameters:
  - name: period_start
    column: start_date
    comparison: on_or_after
  - name: period_end
    column: start_date
    comparison: on_or_before
filters:
  - column: is_test_account
    equals: "false"
  - column: start_date
    on_or_after: period_start
  - column: start_date
    on_or_before: period_end
group_by:
  - business_id
  - plan_tier
notes:
  - A start counts even when the subscription is later canceled, paused, or unknown.
  - The period is required. There is no default window.
  - Take starts from start_date on this table. subscription_start events are a different count.
known_result:
  note: One worked example from the current fact table, for 2026-01-01 through 2026-09-30. The latest start_date in the table is 2026-09-19.
  period_start: 2026-01-01
  period_end: 2026-09-30
  total: 311
  by_business_id:
    BIZ_1: 99
    BIZ_2: 108
    BIZ_3: 104
